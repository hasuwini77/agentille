name: release

# Every v* tag becomes a GitHub Release whose notes are that version's CHANGELOG section, so the
# Releases page never lags the tags again. The release job waits for the same validator the PR
# ran (scripts/validate.sh, with the mod tests): a tag on a commit that does not pass gets no Release.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Claude Code CLI (same pin as validate.yml)
        run: npm install -g @anthropic-ai/claude-code@2.1.309
      - name: Structural validator, hook tests, mod tests
        env:
          CI: "true"
        run: bash scripts/validate.sh
      - name: The tag matches plugin.json
        run: |
          V="${GITHUB_REF_NAME#v}"
          PV=$(node -p "require('./.claude-plugin/plugin.json').version")
          [ "$V" = "$PV" ] || { echo "tag v$V but plugin.json says $PV"; exit 1; }
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG section
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
